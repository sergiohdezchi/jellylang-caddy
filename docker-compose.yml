name: caddy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [proxy]

networks:
  proxy:
    external: true

volumes:
  caddy-data:
    external: true
    name: visor_caddy-data
  caddy-config:
    external: true
    name: visor_caddy-config
